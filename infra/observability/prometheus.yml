# Prometheus scrape config for the local `obs` compose profile (§14.6/14.8).
#
# aaa_api is the FastAPI /metrics endpoint on the host (aaa.api.routes.health),
# not a container — the API normally runs on the host via `python -m aaa`.
# Since PROMETHEUS_MULTIPROC_DIR that one endpoint carries the counters of
# every AAA process on the host (Streamlit wizard, aaa.cli, run_mock_case),
# so a single scrape target is the complete picture.
#
# The remaining jobs watch the observability stack itself: a Loki that stops
# accepting writes or an Alloy that drops entries is otherwise invisible.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: aaa_api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

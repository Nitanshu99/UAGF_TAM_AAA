# Prometheus scrape config for the production overlay (docker-compose.prod.yml).
# Identical to prometheus.yml except that the API is the `aaa_api` container on
# the compose network, not a process on the Docker host.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: aaa_api
    metrics_path: /metrics
    static_configs:
      - targets: ["aaa_api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
